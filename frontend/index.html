<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trade-helper-v1</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0f1117; --panel: #161a23; --border: #242a37;
    --text: #d1d5db; --muted: #9ca3af; --green: #26a69a; --red: #ef5350;
    --accent: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh;
  }
  aside {
    width: 200px; background: var(--panel); border-right: 1px solid var(--border);
    padding: 16px 10px; display: flex; flex-direction: column; gap: 6px;
  }
  aside h1 { font-size: 14px; margin: 0 8px 12px; color: var(--muted); font-weight: 600; }
  .nav-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
    color: var(--muted);
  }
  .nav-item.active { background: #1f2634; color: var(--text); }
  .nav-item .tag { float: right; font-size: 10px; background: #374151; padding: 1px 6px; border-radius: 6px; }
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar {
    display: flex; gap: 10px; align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  select, button {
    background: #1f2634; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  button.primary { background: #234; color: #fff; border-color: #3b4a63; }
  button.primary:hover { background: #2c3a52; }
  .symbol-box { position: relative; min-width: 180px; }
  #symbol-input {
    width: 100%; background: #1f2634; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px;
  }
  #symbol-input:focus { outline: none; border-color: #3b4a63; }
  .symbol-menu {
    position: absolute; top: calc(100% + 4px); left: 0; width: 220px; max-height: 320px;
    overflow-y: auto; background: #1a202c; border: 1px solid var(--border);
    border-radius: 8px; display: none; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .symbol-menu.open { display: block; }
  .symbol-item { padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--text); }
  .symbol-item.highlighted, .symbol-item:hover { background: #234; }
  .content { display: flex; flex: 1; min-height: 0; }
  #chart-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .chart-controls {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .ranges { display: flex; gap: 4px; }
  .ranges button, .zoom button {
    padding: 5px 10px; font-size: 12px; border-radius: 6px; background: transparent;
    color: var(--muted); border: 1px solid transparent; cursor: pointer;
  }
  .ranges button.active { background: #234; color: #fff; border-color: #3b4a63; }
  .zoom { display: flex; gap: 4px; margin-left: auto; }
  .zoom button { border: 1px solid var(--border); background: #1f2634; width: 30px; text-align: center; }
  #chart { flex: 1; min-width: 0; }
  .rail {
    width: 320px; border-left: 1px solid var(--border); overflow-y: auto;
    padding: 14px; display: flex; flex-direction: column; gap: 14px;
  }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .metric {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px;
  }
  .metric .label { font-size: 11px; color: var(--muted); }
  .metric .value { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .value.pos { color: var(--green); } .value.neg { color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0; }
  #placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  #status { font-size: 12px; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>
<aside>
  <h1>trade-helper-v1</h1>
  <div class="nav-item" data-view="today">Today <span class="tag">later</span></div>
  <div class="nav-item active" data-view="explorer">Symbol Explorer</div>
  <div class="nav-item" data-view="lab">Strategy Lab <span class="tag">later</span></div>
  <div class="nav-item" data-view="macro">Macro <span class="tag">later</span></div>
</aside>
<main>
  <div class="toolbar">
    <div class="symbol-box">
      <input id="symbol-input" type="text" placeholder="Symbol (e.g. SPY)" autocomplete="off" spellcheck="false">
      <div class="symbol-menu" id="symbol-menu"></div>
    </div>
    <select id="strategy"><option>SMA Cross</option></select>
    <button class="primary" id="run">Run Backtest</button>
    <span id="status">loading…</span>
  </div>
  <div class="content">
    <div id="chart-area">
      <div class="chart-controls">
        <div class="ranges" id="ranges"></div>
        <div class="zoom">
          <button id="zoom-out" title="Zoom out">−</button>
          <button id="zoom-in" title="Zoom in">+</button>
          <button id="fit" title="Fit all data">⤢</button>
        </div>
      </div>
      <div id="chart"></div>
    </div>
    <div class="rail">
      <div>
        <h2>Metrics</h2>
        <div class="metrics" id="metrics"></div>
      </div>
      <div>
        <h2>Trades</h2>
        <table id="trades">
          <thead><tr><th>Entry</th><th>Exit</th><th>PnL</th><th>%</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (sel) => document.querySelector(sel);

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
  return res.json();
}

/* ---------- chart ---------- */
let chart, candleSeries, volumeSeries, smaFast, smaSlow;

function initChart() {
  chart = LightweightCharts.createChart($('#chart'), {
    layout: { background: { type: 'solid', color: '#0f1117' }, textColor: '#9ca3af' },
    grid: { vertLines: { color: '#1a1f2b' }, horzLines: { color: '#1a1f2b' } },
    rightPriceScale: { borderColor: '#242a37' },
    timeScale: { borderColor: '#242a37', minBarSpacing: 0.1 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350', borderVisible: false,
  });
  volumeSeries = chart.addHistogramSeries({
    priceFormat: { type: 'volume' }, priceScaleId: '',
    color: '#3b4a63',
  });
  chart.priceScale('').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  smaFast = chart.addLineSeries({ color: '#f59e0b', lineWidth: 1, title: 'SMA 20' });
  smaSlow = chart.addLineSeries({ color: '#8b5cf6', lineWidth: 1, title: 'SMA 50' });
  window.__chart = chart; // exposed for in-app testing
}

function smaData(bars, n) {
  const out = [];
  let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i].close;
    if (i >= n) sum -= bars[i - n].close;
    if (i >= n - 1) out.push({ time: bars[i].date, value: +(sum / n).toFixed(2) });
  }
  return out;
}

function markersFromTrades(trades) {
  return trades.flatMap((t) => [
    { time: t.entry_date, position: 'belowBar', color: '#26a69a',
      shape: 'arrowUp', text: `LONG @ ${t.entry_price}` },
    { time: t.exit_date, position: 'aboveBar', color: '#ef5350',
      shape: 'arrowDown', text: `EXIT @ ${t.exit_price}` },
  ]);
}

function renderChart(bars) {
  allBars = bars;
  const candles = bars.map((b) => ({
    time: b.date, open: b.open, high: b.high, low: b.low, close: b.close,
  }));
  candleSeries.setData(candles);
  volumeSeries.setData(bars.map((b) => ({
    time: b.date, value: b.volume, color: b.close >= b.open ? '#1f3a37' : '#3a2222',
  })));
  smaFast.setData(smaData(bars, 20));
  smaSlow.setData(smaData(bars, 50));
  applyRange(currentRange());
}

/* ---------- results rail ---------- */
function metricCard(label, value, color = '') {
  return `<div class="metric"><div class="label">${label}</div>` +
         `<div class="value ${color}">${value}</div></div>`;
}

function renderMetrics(m) {
  const fmt = (v) => (typeof v === 'number' ? v.toFixed(2) : v);
  const ret = m['Return [%]'], bh = m['Buy & Hold Return [%]'];
  $('#metrics').innerHTML =
    metricCard('Return %', fmt(ret), ret >= 0 ? 'pos' : 'neg') +
    metricCard('Buy & Hold %', fmt(bh), bh >= 0 ? 'pos' : 'neg') +
    metricCard('Max DD %', fmt(m['Max. Drawdown [%]']), 'neg') +
    metricCard('Win Rate %', fmt(m['Win Rate [%]'])) +
    metricCard('Profit Factor', fmt(m['Profit Factor'])) +
    metricCard('Sharpe', fmt(m['Sharpe Ratio'])) +
    metricCard('# Trades', m['# Trades']) +
    metricCard('Exposure %', fmt(m['Exposure Time [%]']));
}

function renderTrades(trades) {
  const rows = trades.slice(-25).reverse().map((t) =>
    `<tr><td>${t.entry_date}</td><td>${t.exit_date}</td>` +
    `<td class="${t.pnl >= 0 ? 'pos' : 'neg'}">${t.pnl.toFixed(0)}</td>` +
    `<td class="${t.pnl >= 0 ? 'pos' : 'neg'}">${t.return_pct.toFixed(1)}%</td></tr>`
  ).join('');
  $('#trades').querySelector('tbody').innerHTML =
    rows || '<tr><td colspan="4">no trades</td></tr>';
}

/* ---------- flow ---------- */
let symbolList = [];
let selectedSymbol = 'SPY';
let highlightIndex = -1;

async function loadSymbols() {
  const { symbols } = await api('/api/symbols');
  symbolList = symbols;
  $('#symbol-input').value = selectedSymbol;
  renderMenu('');
}

function renderMenu(query) {
  const q = query.trim().toUpperCase();
  const matches = q ? symbolList.filter((s) => s.toUpperCase().includes(q)) : symbolList;
  highlightIndex = -1;
  $('#symbol-menu').innerHTML = matches.slice(0, 200).map((s) =>
    `<div class="symbol-item ${s === selectedSymbol ? 'highlighted' : ''}" data-symbol="${s}">${s}</div>`
  ).join('');
  $('#symbol-menu').classList.add('open');
}

function closeMenu() { $('#symbol-menu').classList.remove('open'); }

function chooseSymbol(s) {
  selectedSymbol = s;
  $('#symbol-input').value = s;
  closeMenu();
  run();
}

const symbolInput = $('#symbol-input');
const symbolMenu = $('#symbol-menu');

symbolInput.addEventListener('focus', () => renderMenu(symbolInput.value));
symbolInput.addEventListener('input', () => renderMenu(symbolInput.value));
symbolInput.addEventListener('keydown', (e) => {
  const items = Array.from(symbolMenu.querySelectorAll('.symbol-item'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!items.length) return;
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    highlightIndex = (highlightIndex + dir + items.length) % items.length;
    items.forEach((it, i) => it.classList.toggle('highlighted', i === highlightIndex));
    items[highlightIndex].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const active = items.find((it) => it.classList.contains('highlighted'));
    if (active) chooseSymbol(active.dataset.symbol);
    else if (items.length === 1) chooseSymbol(items[0].dataset.symbol);
    else { selectedSymbol = symbolInput.value; closeMenu(); run(); }
  } else if (e.key === 'Escape') {
    closeMenu();
  }
});
symbolMenu.addEventListener('mousedown', (e) => {
  const item = e.target.closest('.symbol-item');
  if (item) { e.preventDefault(); chooseSymbol(item.dataset.symbol); }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.symbol-box')) closeMenu();
});

async function run() {
  const symbol = $('#symbol-input').value || selectedSymbol;
  const strategy = $('#strategy').value;
  $('#status').textContent = 'running backtest…';
  try {
    const [barsData, backtest] = await Promise.all([
      api(`/api/bars/${symbol}`),
      api(`/api/backtest/${symbol}?strategy=${encodeURIComponent(strategy)}`),
    ]);
    renderChart(barsData.bars);
    candleSeries.setMarkers(markersFromTrades(backtest.trades));
    renderMetrics(backtest.metrics);
    renderTrades(backtest.trades);
    $('#status').textContent =
      `${backtest.trades.length} trades · ${symbol} · ${strategy}`;
  } catch (err) {
    $('#status').textContent = `error: ${err.message}`;
  }
}

document.querySelectorAll('.nav-item').forEach((item) => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach((i) => i.classList.remove('active'));
    item.classList.add('active');
  });
});

/* ---------- range + zoom controls ---------- */
const RANGES = [
  ['3M', 63], ['6M', 126], ['1Y', 252], ['2Y', 504],
  ['3Y', 756], ['5Y', 1260], ['10Y', 2520], ['ALL', Infinity],
];
let allBars = [];

function currentRange() {
  const active = document.querySelector('.range.active');
  return active ? active.dataset.label : '3Y';
}

function buildRanges() {
  $('#ranges').innerHTML = RANGES.map(([label]) =>
    `<button class="range ${label === '3Y' ? 'active' : ''}" data-label="${label}">${label}</button>`
  ).join('');
  document.querySelectorAll('.range').forEach((btn) =>
    btn.addEventListener('click', () => {
      document.querySelectorAll('.range').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      applyRange(btn.dataset.label);
    })
  );
}

function applyRange(label) {
  if (!allBars.length) return;
  const n = RANGES.find(([l]) => l === label)[1];
  if (label === 'ALL' || n >= allBars.length) {
    chart.timeScale().fitContent();
    return;
  }
  chart.timeScale().setVisibleLogicalRange({
    from: allBars.length - n,
    to: allBars.length - 1,
  });
}

function zoom(factor) {
  const range = chart.timeScale().getVisibleLogicalRange();
  if (!range) return;
  const center = (range.from + range.to) / 2;
  const half = ((range.to - range.from) * factor) / 2;
  chart.timeScale().setVisibleLogicalRange({ from: center - half, to: center + half });
}

$('#zoom-in').addEventListener('click', () => zoom(0.7));
$('#zoom-out').addEventListener('click', () => zoom(1.4));
$('#fit').addEventListener('click', () => chart.timeScale().fitContent());
buildRanges();

$('#run').addEventListener('click', run);

initChart();
loadSymbols().then(run);
</script>
</body>
</html>
